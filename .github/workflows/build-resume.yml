name: Build Resume

on:
  push:
    branches: [zh_CN, zzh_resume, master, main]
  pull_request:
    branches: [zh_CN, zzh_resume, master, main]
  workflow_dispatch:

jobs:
  build-resume:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile resume (XeLaTeX, 2 passes)
        run: |
          mkdir -p build
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=build resume-zh_CN.tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error -output-directory=build resume-zh_CN.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-zh_CN
          path: build/resume-zh_CN.pdf
          if-no-files-found: error
